<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><div class="grid">
        <div class="col-12 lg:col-6 xl:col-3">
        <div class="card mb-0">
        <div class="flex justify-content-between mb-3">
        <div>
        <span class="block text-500 font-medium mb-3">Total Users</span>
        <div class="text-900 font-medium text-xl">{{dashboardData.totalUsers}}</div>
        </div>
        <div class="flex align-items-center justify-content-center bg-blue-100 border-round"
        style="width:2.5rem;height:2.5rem">
        <i class="pi pi-users text-blue-500 text-xl"></i>
        </div>
        </div>
        </div>
        </div>
        <div class="col-12 lg:col-6 xl:col-3">
        <div class="card mb-0">
        <div class="flex justify-content-between mb-3">
        <div>
        <span class="block text-500 font-medium mb-3">Active Today</span>
        <div class="text-900 font-medium text-xl">{{dashboardData.activeToday}}</div>
        </div>
        <div class="flex align-items-center justify-content-center bg-orange-100 border-round"
        style="width:2.5rem;height:2.5rem">
        <i class="pi pi-chart-line text-orange-500 text-xl"></i>
        </div>
        </div>
        </div>
        </div>
        <div class="col-12 lg:col-6 xl:col-3">
        <div class="card mb-0">
        <div class="flex justify-content-between mb-3">
        <div>
        <span class="block text-500 font-medium mb-3">Total Transactions</span>
        <div class="text-900 font-medium text-xl">{{dashboardData.totalTransactions}}</div>
        </div>
        <div class="flex align-items-center justify-content-center bg-cyan-100 border-round"
        style="width:2.5rem;height:2.5rem">
        <i class="pi pi-shopping-cart text-cyan-500 text-xl"></i>
        </div>
        </div>
        </div>
        </div>
        <div class="col-12 lg:col-6 xl:col-3">
        <div class="card mb-0">
        <div class="flex justify-content-between mb-3">
        <div>
        <span class="block text-500 font-medium mb-3">Total Revenue</span>
        <div class="text-900 font-medium text-xl">${{dashboardData.totalRevenue}}</div>
        </div>
        <div class="flex align-items-center justify-content-center bg-purple-100 border-round"
        style="width:2.5rem;height:2.5rem">
        <i class="pi pi-money-bill text-purple-500 text-xl"></i>
        </div>
        </div>
        </div>
        </div>

        <div class="col-12">
        <div class="card">
        <h5>Recent Transactions</h5>
        <p-table [value]="recentTransactions" [paginator]="true" [rows]="5">
        <ng-template pTemplate="header">
        <tr>
        <th>ID</th>
        <th>User</th>
        <th>Amount</th>
        <th>Store</th>
        <th>Status</th>
        </tr>
        </ng-template>
        <ng-template pTemplate="body" let-transaction>
        <tr>
        <td>{{transaction.id}}</td>
        <td>{{transaction.user}}</td>
        <td>${{transaction.amount}}</td>
        <td>{{transaction.store}}</td>
        <td><span [class]="'customer-badge status-' +
        transaction.status.toLowerCase()">{{transaction.status}}</span></td>
        </tr>
        </ng-template>
        </p-table>
        </div>
        </div>
        </div></title>
</head>
<body>

</body>
</html>
