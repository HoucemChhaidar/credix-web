<div class="grid">
  <div class="col-12">
    <div class="card">
      <p-toast></p-toast>
      <p-toolbar styleClass="mb-4">
        <ng-template pTemplate="left">
          <div class="my-2">
            <button pButton pRipple label="New" icon="pi pi-plus" class="p-button-success mr-2" (click)="editWallet(null)"></button>
            <button pButton pRipple label="Delete" icon="pi pi-trash" class="p-button-danger" [disabled]="!selectedWallets || !selectedWallets.length"></button>

          </div>
        </ng-template>
         <ng-template pTemplate="right">
            <button pButton pRipple label="Transfer Amount" icon="pi pi-credit-card" class="p-button-warning ml-2 text-black"
              
               (click)="transferDialog = true"></button>
        </ng-template>
      </p-toolbar>

      <p-table #dt [value]="wallets" [columns]="cols" responsiveLayout="scroll" [paginator]="true"
        [rows]="10" [(selection)]="selectedWallets" selectionMode="multiple" [rowHover]="true" dataKey="tokenizedId">
          <ng-template pTemplate="caption">
                    <div class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
                        <h5 class="m-0">Manage Wallets</h5>
                        <span class="block mt-2 md:mt-0 p-input-icon-left">
                            <i class="pi pi-search"></i>
                            <input pInputText type="text" (input)="dt.filterGlobal($event.target.value, 'contains')"
                                placeholder="Search..." />
                        </span>
                    </div>
                </ng-template>
        <ng-template pTemplate="header" let-columns>
          <tr>
            <th style="width: 3rem"><p-tableHeaderCheckbox></p-tableHeaderCheckbox></th>
            <th *ngFor="let col of columns" pSortableColumn="{{col.field}}">
              {{col.header}}
              <p-sortIcon [field]="col.field"></p-sortIcon>
            </th>
            <th>Actions</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-wallet let-columns="columns">
          <tr>
            <td><p-tableCheckbox [value]="wallet"></p-tableCheckbox></td>
            <td *ngFor="let col of columns">
              <span *ngIf="col.field === 'active'">
                <i class="pi" [class.pi-check-circle]="wallet[col.field]" [class.pi-times-circle]="!wallet[col.field]"
                  [ngClass]="{'text-green-500': wallet[col.field], 'text-red-500': !wallet[col.field]}"></i>
              </span>
              <span *ngIf="col.field === 'createdAt'">
                {{ wallet[col.field] | date:'dd-MM-yyyy HH:mm' }}
              </span>
              <span *ngIf="col.field !== 'active' && col.field !== 'createdAt'">{{ wallet[col.field] }}</span>
            </td>
            <td>
              <div class="flex">
                <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2" (click)="editWallet(wallet)"></button>
                <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-warning" (click)="deleteWallet(wallet)"></button>
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>

<p-dialog header="Confirmation" [(visible)]="transferDialog" [modal]="true" [style]="{width:'400px'}">
  <div class="confirmation-content">
    <i class="pi pi-exclamation-triangle mr-2" style="font-size: 2rem"></i>
    <span>Send the amount to all selected wallets?</span>
  </div>

  <ng-template pTemplate="footer">
    <button pButton pRipple label="No" icon="pi pi-times" class="p-button-text" (click)="transferDialog=false"></button>
    <button pButton pRipple label="Yes" icon="pi pi-check" class="p-button-text" (click)="confirmTransfer()"></button>
  </ng-template>
</p-dialog>
